[project]
name = "polybot-api"
version = "0.1.0"
description = "Polybot API — the HTTP backend of the language tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.14",
    "cactus-needle>=3.2.8",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is expressed as an argument default on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
